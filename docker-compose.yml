version: '3.8'

services:
  # 1. LLM / Ollama Server
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_CONTEXT_LENGTH=8192
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always

  # 2. Main Text LLM Model Puller
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      sh -c "ollama list | grep -q 'llama3.1:8b' || pull llama3.1:8b"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # 2.1 Embedding Model Puller
  ollama-embed-init:
    image: ollama/ollama:latest
    container_name: ollama-embed-init
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      sh -c "ollama list | grep -q 'qwen3-embedding' || pull pull qwen3-embedding"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # 2.2 Multimodal / Vision Model Puller
  ollama-vision-init:
    image: ollama/ollama:latest
    container_name: ollama-vision-init
    environment:
      - OLLAMA_HOST=ollama:11434
    command: pull llama3.2-vision:11b
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # 3. Postgres
  postgres:
    image: postgres:15-alpine
    container_name: halasearch_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Qdrant Vector DB
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  # 7. Redis Queue
  redis:
    image: redis:7-alpine
    container_name: halasearch_redis
    ports:
      - "6379:6379"
    restart: always

  # 8. Background Worker
  worker:
    build:
      context: .
      dockerfile: Docker/web/Dockerfile
    container_name: agent_worker
    command: celery -A worker.celery_app worker --loglevel=INFO
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
      - QDRANT_URL=${QDRANT_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - UNSTRUCTURED_URL=http://unstructured:8000
      - TEXT_MODEL=${TEXT_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - VISION_MODEL=${VISION_MODEL}
      - HF_TOKEN=${HF_TOKEN}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
    volumes:
      - ./data:/app/data
      - .:/app
      - hf_cache:/root/.cache/huggingface
      - docling_cache:/root/.cache/docling
    depends_on:
      - redis
      - postgres
      - qdrant
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: always

  # 9. Docling / RAG Extraction Visual Viewer
  docling-viewer:
    build:
      context: .
      dockerfile: Docker/web/Dockerfile
    container_name: docling_viewer
    command: streamlit run tools/docling_viewer.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
    volumes:
      - ./uploads:/app/uploads
      - ./extracted_files:/app/extracted_files
      - ./data:/app/data
      - .:/app
      - hf_cache:/root/.cache/huggingface
      - docling_cache:/root/.cache/docling
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: always

  # 6. FastAPI Web Service
  web-api:
    build:
      context: .
      dockerfile: Docker/web/Dockerfile
    container_name: agent_web_api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - QDRANT_URL=${QDRANT_URL}
      - OLLAMA_URL=${OLLAMA_URL}
      - UNSTRUCTURED_URL=http://unstructured:8000
      - TEXT_MODEL=${TEXT_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - VISION_MODEL=${VISION_MODEL}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
    volumes:
      - ./data:/app/data
      - .:/app
      - hf_cache:/root/.cache/huggingface
      - docling_cache:/root/.cache/docling
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    restart: always

volumes:
  ollama_storage:
  pgdata:
  qdrant_storage:
  hf_cache:
  docling_cache: