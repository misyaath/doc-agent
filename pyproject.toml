[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "Pre-Code",
    "alembic/versions",
    "data",
    "extracted_files",
    "uploads",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "B008",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"agent/prompts.py" = ["E501"]
"alembic/env.py" = ["E402", "F401"]
"alembic/versions/*.py" = ["E501"]
"extracter/prompts.py" = ["E501"]
"extracter/summarizer.py" = ["E501"]
"worker.py" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
exclude = [
    "^\\.venv/",
    "^venv/",
    "^Pre-Code/",
    "^alembic/versions/",
    "^data/",
    "^extracted_files/",
    "^uploads/",
]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "docling.*",
    "docling_core.*",
    "fastembed.*",
    "langchain_core.*",
    "langchain_ollama.*",
    "langgraph.*",
    "llama_index.*",
    "PIL.*",
    "qdrant_client.*",
    "redis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "core.settings",
    "schemas.*",
]
disable_error_code = [
    "attr-defined",
    "typeddict-unknown-key",
]

[[tool.mypy.overrides]]
module = [
    "alembic.env",
]
disable_error_code = [
    "attr-defined",
]
